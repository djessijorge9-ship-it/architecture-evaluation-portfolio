name: Verify Vite Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Verify the preserved reference component
        run: node scripts/verify-source.mjs

      - name: Build static production bundle
        run: npm run build

      - name: Verify dist/index.html exists
        run: test -f dist/index.html
