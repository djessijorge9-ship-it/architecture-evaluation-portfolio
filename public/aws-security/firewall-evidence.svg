<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Network queries and containment</title><desc id="desc">Query observations from a displayed 12-hour window. Typeset technical summary, not an original console capture.</desc><rect width="640" height="480" rx="20" fill="#f4f7fa"/><g font-family="Inter,Arial,sans-serif"><text x="24" y="32" font-size="12" font-weight="700" fill="#007e76">LAB VALIDATION SUMMARY</text><text x="24" y="68" font-size="24" font-weight="700" fill="#12233d">Network queries and containment</text><text x="24" y="94" font-size="14" font-weight="400" fill="#526174">Query observations from a displayed 12-hour window.</text><rect x="24" y="126" width="286" height="143" rx="14" fill="#ffffff" stroke="#d7e2e9"/><rect x="330" y="126" width="286" height="143" rx="14" fill="#ffffff" stroke="#d7e2e9"/><text x="44" y="156" font-size="12" font-weight="700" fill="#315fee">ICMP MATCHES</text><text x="44" y="204" font-size="36" font-weight="700" fill="#12233d">396,192</text><text x="44" y="242" font-size="14" font-weight="400" fill="#526174">10,000 result rows displayed</text><text x="350" y="156" font-size="12" font-weight="700" fill="#315fee">SIGNATURE MATCHES</text><text x="350" y="204" font-size="36" font-weight="700" fill="#12233d">12,163</text><text x="350" y="242" font-size="14" font-weight="400" fill="#526174">10,000 result rows displayed</text><rect x="24" y="292" width="592" height="135" rx="14" fill="#fff8ec" stroke="#eadcbf"/><text x="44" y="322" font-size="18" font-weight="400" fill="#654b20">Recorded curl result: DNS failure (exit 6).</text><text x="44" y="366" font-size="16" font-weight="400" fill="#654b20">The TLS-timeout test was not reproduced. Quarantine groups</text><text x="44" y="388" font-size="16" font-weight="400" fill="#654b20">retained some internal connectivity.</text><text x="24" y="458" font-size="12" font-weight="400" fill="#526174">Typeset summary of guided lab observations</text></g></svg>