<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Encryption: recorded validation</title><desc id="desc">Final-attempt process records and completed table scans. Typeset technical summary, not an original console capture.</desc><rect width="640" height="480" rx="20" fill="#f4f7fa"/><g font-family="Inter,Arial,sans-serif"><text x="24" y="32" font-size="12" font-weight="700" fill="#007e76">LAB VALIDATION SUMMARY</text><text x="24" y="68" font-size="24" font-weight="700" fill="#12233d">Encryption: recorded validation</text><text x="24" y="94" font-size="14" font-weight="400" fill="#526174">Final-attempt process records and completed table scans.</text><rect x="24" y="126" width="286" height="99" rx="14" fill="#ffffff" stroke="#d7e2e9"/><rect x="330" y="126" width="286" height="99" rx="14" fill="#ffffff" stroke="#d7e2e9"/><text x="44" y="153" font-size="12" font-weight="700" fill="#526174">OLDER ATTEMPT</text><text x="44" y="184" font-size="21" font-weight="700" fill="#12233d">Begun 7 November</text><text x="44" y="208" font-size="14" font-weight="400" fill="#526174">Separate attempt record</text><text x="350" y="153" font-size="12" font-weight="700" fill="#007e76">FINAL ATTEMPT · 9 NOVEMBER</text><text x="350" y="184" font-size="21" font-weight="700" fill="#12233d">5 runs · exit code 0</text><text x="350" y="208" font-size="14" font-weight="400" fill="#526174">11 recovered insertion fragments</text><rect x="24" y="246" width="186" height="91" rx="14" fill="#ffffff" stroke="#d7e2e9"/><text x="44" y="273" font-size="12" font-weight="700" fill="#315fee">TABLE 1</text><text x="44" y="310" font-size="29" font-weight="700" fill="#12233d">1,033</text><rect x="227" y="246" width="186" height="91" rx="14" fill="#ffffff" stroke="#d7e2e9"/><text x="247" y="273" font-size="12" font-weight="700" fill="#315fee">TABLE 2</text><text x="247" y="310" font-size="29" font-weight="700" fill="#12233d">93</text><rect x="430" y="246" width="186" height="91" rx="14" fill="#ffffff" stroke="#d7e2e9"/><text x="450" y="273" font-size="12" font-weight="700" fill="#315fee">TABLE 3</text><text x="450" y="310" font-size="29" font-weight="700" fill="#12233d">1,345</text><rect x="24" y="358" width="592" height="70" rx="14" fill="#fff8ec" stroke="#eadcbf"/><text x="44" y="384" font-size="16" font-weight="400" fill="#654b20">Scope: execution status and population counts only. External key</text><text x="44" y="406" font-size="16" font-weight="400" fill="#654b20">retrieval was simulated.</text><text x="24" y="458" font-size="12" font-weight="400" fill="#526174">Typeset summary of guided lab observations</text></g></svg>