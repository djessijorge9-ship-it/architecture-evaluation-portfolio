<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Preservation and response states</title><desc id="desc">Manual target and second target are distinct execution records. Typeset technical summary, not an original console capture.</desc><rect width="640" height="480" rx="20" fill="#f4f7fa"/><g font-family="Inter,Arial,sans-serif"><text x="24" y="32" font-size="12" font-weight="700" fill="#007e76">LAB VALIDATION SUMMARY</text><text x="24" y="68" font-size="24" font-weight="700" fill="#12233d">Preservation and response states</text><text x="24" y="94" font-size="14" font-weight="400" fill="#526174">Manual target and second target are distinct execution records.</text><rect x="24" y="126" width="286" height="209" rx="14" fill="#ffffff" stroke="#d7e2e9"/><rect x="330" y="126" width="286" height="209" rx="14" fill="#ffffff" stroke="#d7e2e9"/><text x="44" y="154" font-size="12" font-weight="700" fill="#315fee">MANUAL TARGET</text><text x="44" y="190" font-size="18" font-weight="400" fill="#24354b">Metadata object listed</text><text x="44" y="224" font-size="18" font-weight="400" fill="#24354b">Snapshot Completed</text><text x="44" y="258" font-size="18" font-weight="400" fill="#24354b">Zero inbound rules</text><text x="44" y="292" font-size="18" font-weight="400" fill="#24354b">SSM terminal observed</text><text x="350" y="154" font-size="12" font-weight="700" fill="#007e76">SECOND TARGET</text><text x="350" y="190" font-size="18" font-weight="400" fill="#24354b">Metadata object listed</text><text x="350" y="224" font-size="18" font-weight="400" fill="#24354b">Snapshot Completed</text><text x="350" y="258" font-size="18" font-weight="400" fill="#24354b">No IAM role</text><text x="350" y="292" font-size="18" font-weight="400" fill="#24354b">Quarantine group assigned</text><rect x="24" y="357" width="592" height="71" rx="14" fill="#fff8ec" stroke="#eadcbf"/><text x="44" y="383" font-size="16" font-weight="400" fill="#654b20">Course-provided Lambda: configuration and state checks only.</text><text x="44" y="405" font-size="16" font-weight="400" fill="#654b20">Failed SSH was a controlled simulation.</text><text x="24" y="458" font-size="12" font-weight="400" fill="#526174">Typeset summary of guided lab observations</text></g></svg>